<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

    <!-- 🌟 社群分享預覽 (Open Graph & Twitter Cards) 🌟 -->
    <meta name="description" content="{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}隨筆。{{ end }}">
    <meta property="og:title" content="{{ .Title }}" />
    <meta property="og:description" content="{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}隨筆。{{ end }}" />
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
    <meta property="og:url" content="{{ .Permalink }}" />

    <!-- 自動抓取文章第一張圖片作為分享預覽圖 -->
    {{ $ogImage := "" }}
    {{ $matches := findRESubmatch `<img[^>]+src="([^"]+)"` .Content 1 }}
    {{ if $matches }}
        <!-- absURL 非常重要！社群軟體只認得包含 https:// 的完整絕對網址 -->
        {{ $ogImage = index (index $matches 0) 1 | absURL }}
    {{ end }}

    {{ if $ogImage }}
    <meta property="og:image" content="{{ $ogImage }}" />
    <meta name="twitter:image" content="{{ $ogImage }}" />
    <meta name="twitter:card" content="summary_large_image" />
    {{ else }}
    <!-- 如果文章沒圖片，就顯示純文字卡片 -->
    <meta name="twitter:card" content="summary" />
    {{ end }}

    <meta name="twitter:title" content="{{ .Title }}" />
    <meta name="twitter:description" content="{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}隨筆。{{ end }}" />
    <!-- 🌟 結束社群分享預覽設定 🌟 -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="icon" href="{{ "favicon.png" | relURL }}" type="image/png">

    <style>
        :root {
            --bg-color: #f5f3f6;
            --text-color: #333333;
            --title-color: #333333;
            --link-pink: #d988a9;
            --font-sans: 'Noto Sans SC', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Fira Code', 'Courier New', Courier, var(--font-sans);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .site-icon {
            position: fixed; top: 25px; left: 30px; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; z-index: 100;
        }
        .site-icon:hover { opacity: 0.6; }
        .site-icon svg { width: 100%; height: 100%; fill: #aaa; }

        .nav-tags-btn {
            position: fixed; top: 30px; right: 35px; font-size: 0.85em;
            color: #999; text-decoration: none; font-family: var(--font-mono);
            transition: color 0.2s ease; z-index: 100;
        }
        .nav-tags-btn:hover { color: var(--link-pink); }

        .container { width: 100%; max-width: 700px; padding: 100px 20px 80px 20px; box-sizing: border-box; }

        /* 标签：去除了色块框，只保留粉色文字 */
        .tags { margin-bottom: 2.5em; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .tag {
            color: var(--link-pink); background: transparent; padding: 0;
            font-size: 0.85em; text-decoration: none; font-family: var(--font-mono);
            transition: opacity 0.2s;
        }
        .tag:hover { opacity: 0.7; }

        /* 正文排版 */
        .content { letter-spacing: 0.02em; }
        .content p { margin-bottom: 1.8em; color: #444; font-size: 0.98em; }
        .content h1, .content h2, .content h3 { font-family: var(--font-sans); color: var(--title-color); font-weight: 500; margin-top: 2.5em; margin-bottom: 1em; }
        .content a { color: var(--link-pink); text-decoration: none; }
        .content img { max-width: 100%; border-radius: 4px; margin: 2em auto; display: block; }

        /* 讓單張圖片或並排圖片下方的斜體字（*星號包起來的字*）變成極簡圖說 */
        .content img + em,
        .content .row-layout + em {
            display: block;
            text-align: center;
            font-size: 0.85em;
            color: #888;
            font-style: normal; /* 把斜體變回正體 */
            margin-top: 2.9em; /* 把它往上拉靠近圖片 */
            margin-bottom: 2.9em;
        }

        /* 🌟 程式碼區塊 (解決你按 Tab 撐爆網頁的問題) */
        .content pre {
            background-color: #ebebeb; /* 給一個比背景稍微深一點點的灰色 */
            padding: 1.2em;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.9em;
            white-space: pre-wrap; /* 核心魔法：強制過長的文字自動換行！ */
            word-wrap: break-word;
        }

        /* 🌟 新增：圖文並排 (左圖右文) 排版 */
        .side-layout { display: flex; gap: 2em; margin: 2.5em 0; align-items: flex-start; }
        .side-left { flex: 0 0 35%; } /* 左側圖片區塊佔 35% 寬度 */
        .side-left img { margin: 0 0 0.8em 0; width: 100%; height: auto; border-radius: 4px; display: block; }
        .side-caption { font-size: 0.8em; color: #888; line-height: 1.6; font-family: var(--font-sans); }
        .side-caption p { margin: 0; font-size: 1em; } /* 消除 markdown 產生的多餘邊距 */
        .side-right { flex: 1; min-width: 0; }
        .side-right > *:first-child { margin-top: 0; } /* 讓右側第一行文字與左側圖片完美齊頭對齊 */

        /* 🌟 新增：圖片點擊放大的 Lightbox 樣式 */
        .content img { cursor: zoom-in; } /* 讓文章內的圖片滑鼠變成放大鏡 */
        .lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(245, 245, 245, 0.95); /* 配合你極簡淺灰底色的半透明背景 */
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease-out;
        }
        .lightbox-overlay.active { opacity: 1; pointer-events: auto; }
        .lightbox-overlay img {
            max-width: 90vw; max-height: 90vh; border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); /* 給放大後的圖片加一點高級的陰影浮現感 */
            transform: scale(0.95); transition: transform 0.25s ease-out;
            cursor: zoom-out; margin: 0;
        }
        .lightbox-overlay.active img { transform: scale(1); }

        /* 行內小段程式碼或標記的樣式 */
        .content code {
            font-family: var(--font-mono);
            background-color: #ebebeb;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-size: 0.9em;
        }

        /* 音乐播放器：居中且无外框 */
        .minimal-player {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            padding: 0; background-color: transparent; border: none; margin: 2.5em auto; width: 100%;
        }
        .player-btn { background: none; border: none; padding: 0; cursor: pointer; color: #666; display: flex; align-items: center; transition: color 0.2s; }
        .player-btn:hover { color: var(--link-pink); }
        .track-info { font-size: 0.85em; font-family: var(--font-sans); color: #888; }
        .volume-slider { width: 60px; height: 3px; -webkit-appearance: none; background: #e0e0e0; border-radius: 2px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--link-pink); cursor: pointer; }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .site-icon { top: 15px; left: 15px; width: 30px; height: 30px; }
            .nav-tags-btn { top: 20px; right: 20px; }

            /* 🌟 新增：手機版時，自動變回上下排列，以免文字被擠壓太細 */
            .side-layout { flex-direction: column; gap: 1em; }
            .side-left { flex: 1 1 100%; width: 100%; max-width: 100%; }
        }
        /* 響應式 YouTube 影片容器 */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 完美的 16:9 比例 */
            height: 0;
            margin: 2.5em 0; /* 和文字保持舒適的上下距離 */
            border-radius: 6px; /* 加上微圓角，更融入書本排版 */
            overflow: hidden;
            background-color: #f8f8f8; /* 載入前的乾淨底色 */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .yt-hidden-wrapper {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 200px;
            height: 200px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <a href="{{ .Site.BaseURL }}" class="site-icon" title="首页">
        <img src="/images/apple.png" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;" alt="logo">
    </a>

    <a href="{{ .Site.BaseURL }}tags/" class="nav-tags-btn">Tags</a>

    <div class="container">
        {{ block "main" . }}{{ end }}
    </div>

    <!-- YouTube 播放器后端逻辑 -->
    <script>
        let ytPlayer = null;
        function onYouTubeIframeAPIReady() {
            const playerContainer = document.getElementById('yt-iframe-container');
            if (playerContainer) {
                const videoId = playerContainer.getAttribute('data-video-id');
                ytPlayer = new YT.Player('yt-iframe-container', {
                    height: '200', width: '200', videoId: videoId,
                    playerVars: { 'autoplay': 0, 'controls': 0 },
                    events: { 'onReady': bindPlayerControls }
                });
            }
        }

        function bindPlayerControls(event) {
            const playBtn = document.getElementById('custom-play-btn');
            const volSlider = document.getElementById('custom-vol');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            if(!playBtn) return;
            ytPlayer.setVolume(volSlider.value);
            playBtn.addEventListener('click', () => {
                const state = ytPlayer.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    ytPlayer.pauseVideo();
                    iconPlay.classList.remove('hidden'); iconPause.classList.add('hidden');
                } else {
                    ytPlayer.playVideo();
                    iconPlay.classList.add('hidden'); iconPause.classList.remove('hidden');
                }
            });
            volSlider.addEventListener('input', (e) => { ytPlayer.setVolume(e.target.value); });
        }

        /* 🌟 新增：圖片點擊放大的 JavaScript 自動抓取邏輯 */
        document.addEventListener('DOMContentLoaded', () => {
            // 在網頁最底層建立一個看不見的放大畫布
            const overlay = document.createElement('div');
            overlay.className = 'lightbox-overlay';
            const overlayImg = document.createElement('img');
            overlay.appendChild(overlayImg);
            document.body.appendChild(overlay);

            // 自動抓取文章內所有的圖片，並綁定點擊事件
            const images = document.querySelectorAll('.content img');
            images.forEach(img => {
                img.addEventListener('click', () => {
                    overlayImg.src = img.src; // 把點擊的照片路徑丟給放大畫布
                    overlay.classList.add('active'); // 顯示畫布
                });
            });

            // 點擊背景或放大的圖片，就會自動關閉
            overlay.addEventListener('click', () => {
                overlay.classList.remove('active');
            });
        });
    </script>
</body>
</html>
