{{ define "main" }}
<article class="post">
    <h1 style="text-align: center; font-size: 2em; color: var(--title-color); margin-bottom: 50px; font-weight: 500; font-family: var(--font-sans);">
        {{ .Title }}
    </h1>

    {{ with .Params.tags }}
    <div class="tags">
        {{ range . }}
        <a href="{{ "tags/" | relLangURL }}{{ . | urlize }}" class="tag">#{{ . }}</a>
        {{ end }}
    </div>
    {{ end }}

    <div class="content">
        {{ .Content }}
    </div>
</article>
{{ end }}
