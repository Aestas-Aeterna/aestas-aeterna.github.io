<div class="row-layout" style="display: flex; gap: 15px; margin: 2em 0 0.5em 0; align-items: flex-start;">
    <!-- 自動均分你傳入的所有照片 -->
    {{ range .Params }}
    <div style="flex: 1;">
        <img src="{{ . }}" style="margin: 0; width: 100%; height: auto; border-radius: 4px; display: block;">
    </div>
    {{ end }}
</div>
